name: Validate test manifests
on:
  push:
    branches: [test/manifestes-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate-manifests.js
      - run: node --check launcher/update-manifest.js
      - run: node --check launcher/manifest-utils.js
